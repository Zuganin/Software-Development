version: '3.8'

services:
  postgres:
    image: postgres:15
    container_name: payments-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: paymentsdb
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data

  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    container_name: zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    ports:
      - '2181:2181'

  kafka:
    image: confluentinc/cp-kafka:7.5.0
    container_name: kafka
    depends_on:
      - zookeeper
    ports:
      - '9092:9092'
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,PLAINTEXT_HOST://localhost:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: 'true'

  paymentsservice:
    build:
      context: .                            # корень проекта
      dockerfile: PaymentsService/Dockerfile
    container_name: payments-service
    depends_on:
      - postgres
      - kafka
    environment:
      ConnectionStrings__DefaultConnection: "Host=postgres;Port=5432;Database=paymentsdb;Username=postgres;Password=postgres"
      Kafka__BootstrapServers: "kafka:9092"
      ASPNETCORE_ENVIRONMENT: Development
    ports:
      - '8080:80'

  orders-postgres:
    image: postgres:15
    container_name: orders-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: ordersdb
    ports:
      - '5433:5432'
    volumes:
      - orders_postgres_data:/var/lib/postgresql/data

  ordersservice:
    build:
      context: .
      dockerfile: OrdersService/Dockerfile
    container_name: orders-service
    depends_on:
      - orders-postgres
      - kafka
    environment:
      ConnectionStrings__DefaultConnection: "Host=orders-postgres;Port=5432;Database=ordersdb;Username=postgres;Password=postgres"
      Kafka__BootstrapServers: "kafka:9092"
      ASPNETCORE_ENVIRONMENT: Development
    ports:
      - '8081:80'


volumes:
  postgres_data:
  orders_postgres_data:
